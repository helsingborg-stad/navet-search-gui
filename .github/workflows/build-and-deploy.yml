name: Build, test, and publish container

on:
  push:
    branches:
    - "main"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Setup PHP with composer v2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer:v2
    
    - name: Inject access token in .npmrc
      run: | 
        echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ./frontend/app/.npmrc

    - name: Execute buildscript.
      run: cd ./frontend/app/ && php ./build.php --cleanup

    - name: Run tests
      run: |
        cd ./frontend/app && ./vendor/bin/phpunit --testdox tests

  publish-container:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
    - uses: actions/setup-node@v4
      with:
        node-version: '16'

    - name: Setup PHP with composer v2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer:v2

    - name: Inject access token in .npmrc
      run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ./frontend/app/.npmrc

    - name: Build production assets
      run: cd ./frontend/app/ && php ./build.php --cleanup

    - name: Run tests
      run: cd ./frontend/app && ./vendor/bin/phpunit --testdox tests

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Derive image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/navet-search-gui
        tags: |
          type=semver,pattern=v{{version}}
          type=semver,pattern=v{{major}}.{{minor}}
          type=semver,pattern=v{{major}}

    - name: Build and publish container image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
